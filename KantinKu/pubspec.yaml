name: KantinKu
description: KantinKu - aplikasi pemesanan makanan UMKM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: any
  shared_preferences: any
  google_fonts: any
  lucide_icons_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/images/foods/
    - assets/images/canteens/
    - assets/images/branding/
    - assets/images/avatars/